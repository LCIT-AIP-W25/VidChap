name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Start MongoDB
        run: |
          sudo systemctl start mongodb
          mongo --eval 'db.runCommand({ connectionStatus: 1 })'

      - name: Run Tests
        run: |
          pytest tests/

      - name: Deploy Application
        run: |
          echo "Deploying..."
          # Add deployment commands here (e.g., SCP, Docker, Kubernetes)
