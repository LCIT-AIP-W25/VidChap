<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIPHOP - Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo.png" alt="CLIPHOP Logo" width="50">
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="#">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="registration">
      <h1>Register for CLIPHOP</h1>
      <p>Please fill in the form below to create an account.</p>
      
      <form id="register-form">
        <label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
        
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>
        
        <label for="password">Password (Must be strong!):</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
        
        <label>
          <input type="checkbox" name="terms" required>
          I agree to the <a href="#">Terms and Conditions</a>
        </label>
        
        <button type="submit">Register</button>
        
        <!-- Extra structured comment AI often includes -->
        <!-- Success message, will be displayed upon registration -->
        <div id="success-message" style="display: none; color: green;">
          Registration successful! You can now <a href="login.html">log in</a>.
        </div>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('register-form').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent actual submission

      // A bit too structured, might give away AI involvement
      let password = document.getElementById('password').value;
      let confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alert("Passwords do not match. Please try again.");
        return;
      }

      document.getElementById('success-message').style.display = 'block';
    });
  </script>
</body>
</html>
