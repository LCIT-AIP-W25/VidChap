<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIPHOP - Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="logo.png" alt="CLIPHOP Logo" width="50">
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="#">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="registration-container">
      <h1>Create Your CLIPHOP Account</h1>
      <p>Join us and start organizing your videos smarter.</p>

      <form id="register-form">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" placeholder="John Doe" required>
          <span class="error-message" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="example@mail.com" required>
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required>
          <span class="error-message" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter a strong password" required>
          <meter max="4" id="password-strength-meter"></meter>
          <span class="error-message" id="password-error"></span>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required>
          <span class="error-message" id="confirm-password-error"></span>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="terms" required>
            I agree to the <a href="#">Terms & Conditions</a>
          </label>
        </div>

        <button type="submit">Register</button>
        <div id="success-message" class="success-message" style="display: none;">
          Registration successful! <a href="login.html">Login now</a>.
        </div>
      </form>
    </section>
  </main>

  <script src="register.js"></script>

</body>
</html>
